<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 -34 140 140"%3E%3Cellipse cx="56" cy="36" rx="50" ry="32" fill="#E1F5EE" stroke="#0F6E56" stroke-width="5"/%3E%3Cpolygon points="104,36 137,6 137,66" fill="#0F6E56"/%3E%3Ccircle cx="21" cy="27" r="5" fill="#0F6E56"/%3E%3Crect x="34" y="19" width="50" height="9" rx="4.5" fill="#EF9F27"/%3E%3Crect x="34" y="32" width="58" height="9" rx="4.5" fill="#378ADD"/%3E%3Crect x="34" y="45" width="42" height="9" rx="4.5" fill="#D85A30"/%3E%3C/svg%3E">
<title>adoq QDA — Analyse de données qualitatives</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5f5b'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%23fff'/%3E%3Crect x='7' y='15' width='12' height='3' rx='1.5' fill='%23f2c14e'/%3E%3Crect x='7' y='21' width='15' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --ink: #1d2726; --ink2: #56615f; --ink3: #8a9492;
  --bg: #f6f4ef; --paper: #fffdf9; --line: #e3ded3; --line2: #efebe2;
  --accent: #1f5f5b; --accent-l: #e3efed; --warn: #b4531f; --bad: #a3322a; --good: #2e7d4f;
  --radius: 8px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; color: var(--ink);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 5px 10px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.1); }
button.ghost { border-color: transparent; background: transparent; }
button.small { padding: 2px 8px; font-size: 12px; }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: default; }
input, textarea, select { font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-l); border-color: var(--accent); }

#app { display: flex; flex-direction: column; height: 100vh; }
#top { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: var(--paper); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.brand em { font-style: normal; color: var(--accent); }
.logo { width: 34px; height: auto; display: inline-block; flex: none; }
#title { font-weight: 600; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
#menu { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; }
#menu .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
#menu > button, #menu .drop > button { padding: 4px 7px; font-size: 13px; }
#menu .icon { width: 28px; padding: 3px 0; }
.status { font-size: 12px; color: var(--ink3); white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.status.dirty { color: var(--warn); font-weight: 600; }
.status.ok { color: var(--good); }
.coder { font-size: 13px; color: var(--ink2); white-space: nowrap; }
.coder input { width: 96px; }
.coder input.missing { border-color: var(--bad); background: #fff3f1; }
.drop { position: relative; }
.dropmenu { display: none; position: absolute; top: 100%; left: 0; z-index: 30; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 4px; min-width: 330px; }
.drop:hover .dropmenu, .drop:focus-within .dropmenu { display: block; }
.dropmenu button { display: block; width: 100%; text-align: left; border: 0; }
.dropmenu button:hover { background: var(--accent-l); }
.dropmenu hr { border: 0; border-top: 1px solid var(--line2); margin: 4px 0; }
body.nop .needs-p { display: none; }

/* accueil */
#home { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 48px 20px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 28px 32px; max-width: 720px; width: 100%; }
.card h1 { margin: 0 0 6px; font-size: 24px; }
.card p.lead { color: var(--ink2); margin: 0 0 22px; line-height: 1.5; }
.bigbtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
.bigbtns button { padding: 16px 12px; text-align: left; line-height: 1.35; }
.bigbtns button b { display: block; font-size: 15px; margin-bottom: 3px; }
.bigbtns button span { font-size: 12px; color: var(--ink2); }
.bigbtns button.primary span { color: #dceeed; }
.recent { list-style: none; padding: 0; margin: 6px 0 18px; }
.recent li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line2); }
.recent li button:first-child { flex: 1; text-align: left; border: 0; padding: 4px 0; }
.recent .when { color: var(--ink3); font-size: 12px; }
.notice { font-size: 13px; padding: 10px 12px; border-radius: var(--radius); background: #fbf3e4; border: 1px solid #efdcb6; line-height: 1.45; margin: 10px 0; }
.notice.info { background: var(--accent-l); border-color: #c7dedb; }

#home .notice input[type=radio] { margin-right: 4px; }
.homeextra { font-size: 13px; color: var(--ink2); margin: -8px 0 18px; }
#home h1 { display: flex; align-items: center; gap: 12px; }
#home h1 .homelogo { width: 72px; height: auto; flex: none; }
#home h1 .qda { color: var(--accent); font-size: .6em; font-weight: 600; margin-left: 4px; letter-spacing: .5px; }
#home .subtitle { margin: -6px 0 14px; color: var(--accent); font-weight: 600; letter-spacing: .2px; }

/* espace de travail */
#work { flex: 1; display: grid; grid-template-columns: 250px 1fr 300px; min-height: 0; }
#work[hidden] { display: none; }
aside { background: var(--paper); overflow: auto; display: flex; flex-direction: column; min-height: 0; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
.panel-h { display: flex; justify-content: space-between; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink3); font-weight: 700; padding: 12px 12px 6px; }
#search { margin: 0 10px 6px; }
#searchres { margin: 0 10px; font-size: 12px; }
#searchres .res { padding: 5px 6px; border-radius: 6px; cursor: pointer; border-bottom: 1px solid var(--line2); }
#searchres .res:hover { background: var(--accent-l); }
#searchres .res b { color: var(--ink2); font-weight: 600; }
#searchres mark { background: #f7e08a; }
#docs { list-style: none; margin: 0; padding: 0 6px; }
#docs li { padding: 7px 8px; border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; position: relative; }
#docs li:hover { background: var(--line2); }
#docs li.cur { background: var(--accent-l); }
#docs .dname { font-weight: 600; padding-right: 50px; overflow-wrap: anywhere; }
#docs .dsub { font-size: 11px; color: var(--ink2); }
.dcode { font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace; color: var(--accent); background: var(--accent-l); border-radius: 4px; padding: 2px 4px; margin-right: 6px; vertical-align: 1px; }
#docs .dmeta { font-size: 11px; color: var(--ink3); }
#docs .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
#docs .bar i { display: block; height: 100%; background: var(--accent); }
#docs .dact { position: absolute; right: 4px; top: 5px; display: none; }
#docs li:hover .dact { display: flex; gap: 2px; }
.dact button, .tact button { border: 0; background: transparent; padding: 1px 4px; font-size: 12px; color: var(--ink2); }
.dact button:hover, .tact button:hover { background: #fff; color: var(--accent); }
button.add { margin: 8px 12px; border-style: dashed; color: var(--ink2); }
#stats { margin-top: auto; padding: 10px 12px; font-size: 12px; color: var(--ink3); border-top: 1px solid var(--line2); line-height: 1.5; }

#center { overflow: auto; min-height: 0; background: var(--bg); }
#dochead { position: sticky; top: 0; z-index: 5; background: rgba(246,244,239,.96); backdrop-filter: blur(3px); padding: 12px 28px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#dochead h2 { margin: 0; font-size: 18px; flex: 1; min-width: 200px; }
#dochead .meta { color: var(--ink3); font-size: 12px; }
#dochead .dh1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; }
#dochead .dh2 { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; width: 100%; font-size: 12px; color: var(--ink2); }
#dochead .dh2 label { white-space: nowrap; }
#dochead .metaline { flex: 1; min-width: 0; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dochead select { font-size: 12px; padding: 3px 6px; }
#memo { padding: 10px 28px 0; }
#memo textarea { width: 100%; min-height: 90px; resize: vertical; background: #fffbe9; border-color: #efdcb6; }
#paras { padding: 14px 28px 120px; max-width: 900px; }
.para { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px 8px; margin-bottom: 10px; position: relative; content-visibility: auto; contain-intrinsic-size: auto 120px; }
.para.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 4px #f2c14e; } 100% { box-shadow: 0 0 0 0 transparent; } }
.para .plabel { font-size: 11px; color: var(--ink3); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.para .whole { position: absolute; left: -1px; top: 8px; bottom: 8px; display: flex; gap: 2px; }
.para .whole i { width: 4px; border-radius: 2px; }
.ptext { line-height: 1.75; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
.ptext mark { color: inherit; border-radius: 2px; background-repeat: no-repeat; }
.ptext mark.hot { outline: 2px solid var(--ink); outline-offset: 1px; }
.ptext .sq { background: #f7e08a; }
.pfoot { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 6px; min-height: 22px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; border-radius: 11px; padding: 1px 4px 1px 8px; background: #fff; border: 1px solid var(--line); max-width: 100%; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip .who { color: var(--ink3); }
.chip .x { border: 0; background: transparent; padding: 0 4px; color: var(--ink3); font-size: 13px; line-height: 1; }
.chip .x:hover { color: var(--bad); }
.chip.orphan { border-color: var(--warn); color: var(--warn); }
.pwhole { opacity: 0; transition: opacity .15s; margin-left: auto; font-size: 12px; padding: 1px 8px; color: var(--ink2); }
.para:hover .pwhole { opacity: 1; }
.para.q { background: transparent; border-style: dashed; }
.para.q .ptext { color: var(--ink2); font-size: 14px; }
.spk { font-size: 11px; font-weight: 700; border: 0; background: transparent; padding: 0 4px; border-radius: 4px; color: var(--accent); }
.spk:hover { background: var(--line2); }
.spk.intervieweur { color: var(--ink3); font-style: italic; font-weight: 600; }
.spk.none { opacity: 0; color: var(--ink3); font-weight: 400; }
.para:hover .spk.none { opacity: 1; }
.pmemo { margin: 6px 0 2px; padding: 5px 8px; font-size: 13px; color: var(--ink2); background: #fffbe9; border-left: 3px solid #e7c75a; white-space: pre-wrap; cursor: pointer; }
.empty { color: var(--ink3); padding: 40px 28px; line-height: 1.6; }

/* arbre */
#tree { padding: 0 6px; }
#treebar { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 10px 8px; }
#treebar button { font-size: 12px; padding: 2px 8px; }
.lockbanner { margin: 0 10px 8px; padding: 6px 8px; font-size: 12px; border-radius: 6px; background: #fbf3e4; border: 1px solid #efdcb6; color: var(--ink2); line-height: 1.4; }
.trow .mm { font-size: 11px; opacity: .7; }
.ori { flex: none; font: 700 10px/16px ui-monospace, Menlo, Consolas, monospace; width: 16px; text-align: center; border-radius: 4px; cursor: help; }
.ori-i { background: #e2f1e7; color: var(--good); }
.ori-d { background: #e8e4f3; color: #5b4a8b; }
.oriopt { display: block; margin: 4px 0; }
.trow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; cursor: pointer; position: relative; border: 1px solid transparent; }
.trow:hover { background: var(--line2); }
.trow.active { background: var(--accent-l); border-color: #c7dedb; }
.trow .tw { width: 14px; text-align: center; color: var(--ink3); font-size: 10px; flex: none; }
.trow .dot { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.trow .lab { flex: 1; overflow-wrap: anywhere; }
.trow .lab.nodef::after { content: " ·"; color: var(--warn); font-weight: 700; }
.trow .n { font-size: 11px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.trow .tact { display: none; width: 100%; padding: 3px 0 1px 20px; gap: 2px; }
.trow.active .tact { display: flex; }
.trow .tact button { background: #fff; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.trow.dz-before { box-shadow: inset 0 2px 0 var(--accent); }
.trow.dz-after { box-shadow: inset 0 -2px 0 var(--accent); }
.trow.dz-inside { background: var(--accent-l); border-color: var(--accent); }
#rootdrop { margin: 8px 12px; padding: 8px; border: 1px dashed var(--line); border-radius: 6px; font-size: 11px; color: var(--ink3); text-align: center; display: none; }
body.dragging #rootdrop { display: block; }
#rootdrop.over { border-color: var(--accent); color: var(--accent); }
.mine { margin-top: auto; padding: 10px 12px; font-size: 12px; border-top: 1px solid var(--line2); color: var(--ink2); }
.mine select { max-width: 100%; margin-top: 4px; display: block; width: 100%; font-size: 12px; }
#viewhint:not(:empty) { margin-top: 6px; font-size: 11px; line-height: 1.4; color: var(--warn); }
.hint { color: var(--ink3); }

/* popover de codage */
#pop { position: fixed; z-index: 50; width: 300px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 8px; }
#popq { width: 100%; }
#poplist { max-height: 280px; overflow: auto; margin-top: 6px; }
.pitem { padding: 5px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.pitem .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.pitem.sel { background: var(--accent-l); }
.pitem.create { color: var(--accent); font-weight: 600; }
.pitem small { color: var(--ink3); margin-left: auto; }
.pophint { font-size: 11px; color: var(--ink3); margin-top: 6px; }

/* dialogues */
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; max-width: min(900px, 94vw); width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,.25); color: var(--ink); background: var(--paper); }
dialog.wide { width: 900px; }
dialog::backdrop { background: rgba(30,35,34,.35); }
#dlgform { padding: 18px 22px; display: flex; flex-direction: column; max-height: 88vh; }
#dlgtitle { margin: 0 0 12px; font-size: 17px; }
#dlgbody { overflow: auto; line-height: 1.5; }
#dlgbody label.f { display: block; margin: 8px 0 4px; font-weight: 600; font-size: 13px; }
#dlgbody input[type=text], #dlgbody textarea, #dlgbody select { width: 100%; }
#dlgbody p select, #dlgbody p input[type=text], #dlgbody .notice input[type=text] { width: auto; }
#dlgbody textarea { min-height: 120px; }
#dlgbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.muted { color: var(--ink3); font-size: 12px; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line2); }
table.t th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--ink3); }
table.t td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover { background: var(--accent-l); }
.k-good { color: var(--good); font-weight: 700; } .k-mid { color: var(--warn); font-weight: 700; } .k-bad { color: var(--bad); font-weight: 700; }
.ex { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; margin: 8px 0; background: #fff; }
.ex .exh { font-size: 12px; color: var(--ink3); display: flex; gap: 8px; align-items: center; }
.ex .exh button { margin-left: auto; }
.ex .ext { line-height: 1.6; margin-top: 4px; }
.ex .ext mark { background: #f7e08a; color: inherit; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; }
.tabs button.on { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
.prev { font-size: 12px; background: var(--line2); border-radius: 6px; padding: 6px 8px; margin: 4px 0 10px; max-height: 70px; overflow: hidden; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100; max-width: 80vw; }
#toast.on { opacity: .95; }
#toast.err { background: var(--bad); }
body.dropping::after { content: "Déposez le fichier : un projet .qda.md s'ouvre, des entretiens (.txt, .docx) sont importés"; position: fixed; inset: 12px; border: 3px dashed var(--accent); border-radius: 16px; background: rgba(227,239,237,.85); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); z-index: 200; pointer-events: none; }
.kbd { font-family: ui-monospace, monospace; font-size: 12px; background: var(--line2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
pre.code { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 12px; overflow: auto; white-space: pre-wrap; }

/* dialogues : comparaison, consensus, journal */
.cons .badge, .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--line2); color: var(--ink2); }
.badge.ok { background: #e2f1e7; color: var(--good); } .badge.no { background: #f7e3e1; color: var(--bad); } .badge.agree { background: var(--accent-l); color: var(--accent); }
.ext .ua { text-decoration: underline 3px #e76f51; text-underline-offset: 3px; } .ext .ub { text-decoration: underline 3px #457b9d; text-underline-offset: 3px; } .ext .uab { text-decoration: underline 3px #8e5ea2; text-underline-offset: 3px; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; } .progress i { display: block; height: 100%; background: var(--accent); }
.jline { padding: 6px 0; border-bottom: 1px solid var(--line2); font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.jline .jd { color: var(--ink3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.jline .jm { color: var(--ink2); font-style: italic; }
.jline button { margin-left: auto; flex: none; }
table.t td.hi { background: #fbf3e4; }
table.t td.zero { color: var(--ink3); }

/* dialogues : import, fiche, locuteurs */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.ex details { margin-top: 6px; font-size: 13px; }
.ex details input[type=text], .ex details input[type=date] { width: 100%; }
.cand { display: grid; grid-template-columns: 22px 1fr 1fr 165px; gap: 6px; align-items: center; margin: 3px 0; font-size: 13px; }
.cand input[type=text] { width: 100%; }
.modes label { display: block; font-size: 13px; margin: 3px 0; }
.respbox { margin: 8px 0; padding: 8px 10px; background: var(--line2); border-radius: 6px; }
.respbox > input[type=text] { width: 100%; }
.attrs { display: grid; grid-template-columns: 70px 90px 1fr; gap: 6px; margin-top: 6px; }
.attrs label { font-size: 11px; color: var(--ink2); display: flex; flex-direction: column; gap: 2px; }
.attrs label.wide { grid-column: 1 / -1; }
.attrs input { width: 100%; font-size: 13px; padding: 3px 6px; }
.spkrow { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
.spkhead { display: flex; gap: 8px; align-items: center; }
.spkhead input { flex: 1; font-weight: 600; }
#dlgbody .spkhead input[type=text] { flex: 1; width: auto; font-weight: 600; }
#dlgbody .spkhead select { width: auto; flex: none; }
.spkhead .muted { white-space: nowrap; }

</style>
</head>
<body>
<div id="app">
  <header id="top">

<script>
/* adoq QDA — noyau : format du fichier projet, import, analyses.
   Sans dépendance ; fonctionne dans le navigateur et sous Node (tests). */
const QDA = (() => {
  const VERSION = '0.4.3';
  const ROLE_I = 'intervieweur', ROLE_R = 'répondant';
  const CONSENSUS = 'consensus';
  const META_KEYS = ['date', 'pseudo', 'intervieweur', 'lieu'];
  const ATTR_KEYS = ['âge', 'genre', 'profession'];
  const DEFAULT_RESPONDENT = 'Répondant';
  /** « âge: 24 ; genre: F » → { âge: '24', genre: 'F' } */
  function parseAttrs(str) {
    const o = {};
    for (const part of String(str || '').split(/\s*;\s*/)) {
      const m = part.match(/^\s*([^:=]+?)\s*[:=]\s*(.*?)\s*$/);
      if (m && m[1] && m[2]) o[m[1]] = m[2];
    }
    return o;
  }
  const cleanKey = (k) => String(k).replace(/[;:=\n]/g, ',').replace(/\s+/g, ' ').trim();
  const cleanAttrs = (o) => Object.fromEntries(Object.entries(o || {}).map(([k, v]) => [cleanKey(k), String(v ?? '').replace(/[;\n]/g, ',').trim()]).filter(([k, v]) => k && v));
  const formatAttrs = (o) => Object.entries(o || {}).filter(([k, v]) => k && v).map(([k, v]) => `${String(k).replace(/[;:=\n]/g, ',').trim()}: ${String(v).replace(/[;\n]/g, ',')}`).join(' ; ');

  // ---------- utilitaires ----------
  const uid = () => {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  };
  function slugify(label) {
    const s = String(label || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/['’]/g, '-')
      .replace(/[^a-z0-9_\-]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    return s && /[a-z]/.test(s) ? s : 'code-' + (s || '1');
  }
  function cleanCoder(name) {
    return String(name || '').trim().replace(/^@/, '').replace(/\s+/g, '_').replace(/[^\p{L}\p{N}_\-.]/gu, '');
  }
  const fold = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const pad = (n) => String(n).padStart(2, '0');
  function stamp(d = new Date()) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function guessRole(name) {
    const n = fold(name).replace(/\.$/, '');
    if (/^(q|e|i|int|enq|interv|anim|mod)$/.test(n)) return ROLE_I;
    if (/^(enquet|interv|interview|moder|anim|cherch|journalist|investig|question)/.test(n)) return ROLE_I;
    return ROLE_R;
  }
  const ROLES = [ROLE_I, ROLE_R, 'participant', 'autre'];
  const normRole = (r) => { const f = fold(r || ''); return /^(interv|enqu|anim|mod|q$)/.test(f) ? ROLE_I : /^partic/.test(f) ? 'participant' : /^autre/.test(f) ? 'autre' : ROLE_R; };

  // ---------- modèle ----------
  function newProject(titre) {
    return { meta: { id: uid(), titre: titre || 'Nouveau projet' }, tree: [], docs: [], journal: [], rejects: [], warnings: [], order: [], preamble: [] };
  }
  const newDoc = (name) => ({ name, code: '', fields: {}, memo: '', meta: {}, speakers: [], paras: [], extra: [] });
  function* walk(nodes, parent = null, depth = 0) {
    for (const n of nodes) {
      yield { node: n, parent, depth };
      yield* walk(n.children, n, depth + 1);
    }
  }
  const allCodes = (p) => [...walk(p.tree)].map((x) => x.node);
  const findCode = (p, id) => allCodes(p).find((n) => n.id === id) || null;
  function parentOf(p, id) {
    for (const x of walk(p.tree)) if (x.node.id === id) return x.parent;
    return null;
  }
  function siblingsOf(p, id) {
    const par = parentOf(p, id);
    return par ? par.children : p.tree;
  }
  const descendants = (node) => [...walk(node.children)].map((x) => x.node.id);
  function codePath(p, id) {
    const out = [];
    let n = findCode(p, id);
    while (n) { out.unshift(n.label); n = parentOf(p, n.id); }
    return out.join(' › ');
  }
  function uniqueCodeId(p, base) {
    const ids = new Set(allCodes(p).map((n) => n.id));
    let id = slugify(base), i = 2;
    const root = id;
    while (ids.has(id)) id = `${root}-${i++}`;
    return id;
  }
  // ---------- origine des codes (même champ que QDA-md : « origine:: inductif | deductif ») ----------
  const ORIGINS = ['inductif', 'deductif'];
  const originOf = (node) => { const v = fold((node.fields && node.fields.origine) || ''); return v.startsWith('induc') ? 'inductif' : v.startsWith('deduc') ? 'deductif' : ''; };
  /** Fixe l'origine d'un code (« inductif », « deductif » ou '' pour non précisée) et, au besoin, sa théorie de référence. */
  function setOrigin(node, origine, theorie = null) {
    node.fields = node.fields || {};
    if (origine && !ORIGINS.includes(origine)) throw new Error('Origine inconnue : ' + origine);
    if (origine) node.fields.origine = origine; else delete node.fields.origine;
    if (theorie !== null) { const t = String(theorie).replace(/\s+/g, ' ').trim(); if (t) node.fields.theorie = t; else delete node.fields.theorie; }
  }
  function addCode(p, label, parentId = null, def = '') {
    const node = { id: uniqueCodeId(p, label), label: String(label).trim(), def, memo: '', fields: {}, children: [] };
    const par = parentId ? findCode(p, parentId) : null;
    (par ? par.children : p.tree).push(node);
    return node;
  }
  const isLocked = (p) => !!(p.meta.verrou && p.meta.verrou !== 'non');
  const codeRef = (p, id) => { const n = findCode(p, id); return `« ${n ? n.label : id} » (#${id})`; };

  // ---------- journal de l'arbre ----------
  function logTree(p, type, desc, { coder = '', motif = '', date = null } = {}) {
    const e = { date: date || stamp(), coder: cleanCoder(coder), type, desc, motif };
    p.journal.push(e);
    return e;
  }
  const journalLine = (e) => `- ${e.date} · @${e.coder || '?'} · ${e.type} · ${e.desc}${e.motif ? ` · motif : ${e.motif.replace(/\n/g, ' ')}` : ''}`;
  function parseJournalLine(line) {
    const m = line.match(/^[-*]\s+(\d{4}-\d\d-\d\d(?: \d\d:\d\d)?)\s+·\s+@(\S*)\s+·\s+([^·]+?)\s+·\s+(.*)$/);
    if (!m) return null;
    let desc = m[4], motif = '';
    const mm = desc.match(/^(.*?)\s+·\s+motif : (.*)$/);
    if (mm) { desc = mm[1]; motif = mm[2]; }
    return { date: m[1], coder: m[2] === '?' ? '' : m[2], type: m[3].trim(), desc, motif };
  }

  // ---------- localisation des citations ----------
  function locate(text, quote, occ = 1) {
    if (!quote) return -1;
    let pos = -1;
    for (let i = 0; i < occ; i++) {
      pos = text.indexOf(quote, pos + 1);
      if (pos < 0) return -1;
    }
    return pos;
  }
  function occurrenceAt(text, quote, start) {
    let n = 0, pos = -1;
    while ((pos = text.indexOf(quote, pos + 1)) >= 0 && pos <= start) n++;
    return Math.max(n, 1);
  }
  function spans(para) {
    return para.codings.map((c, i) => {
      if (c.quote === null) return { i, start: 0, end: para.text.length, whole: true, coding: c };
      const s = locate(para.text, c.quote, c.occ);
      return s < 0 ? { i, orphan: true, coding: c } : { i, start: s, end: s + c.quote.length, coding: c };
    });
  }
  /** Retire [rs, re) du texte d'un paragraphe et recale les citations codées. */
  function cutText(para, rs, re) {
    const old = para.text;
    const neu = old.slice(0, rs) + old.slice(re);
    const len = re - rs;
    for (const c of para.codings) {
      if (c.quote === null) continue;
      const s = locate(old, c.quote, c.occ);
      if (s < 0) continue;
      let a = s, b = s + c.quote.length;
      const map = (x) => (x <= rs ? x : x >= re ? x - len : rs);
      a = map(a); b = map(b);
      let q = neu.slice(a, b);
      const lead = q.length - q.trimStart().length;
      q = q.trim();
      if (!q) continue; // la citation n'était que le préfixe : elle restera signalée comme introuvable
      c.quote = q;
      c.occ = occurrenceAt(neu, q, a + lead);
    }
    para.text = neu;
  }

  // ---------- lecture / écriture du fichier (format qda.md) ----------
  // Protection d'une ligne de texte (spéc. § 8.3) : un « \ » initial, retiré à la lecture (un seul).
  const ESC_RE = /^([#>\-+*=|`~<\[!^%\\]|\d+[.)])/;
  const escapeLine = (l) => (ESC_RE.test(l) ? '\\' + l : l);
  const unescapeLine = (l) => (l.startsWith('\\') ? l.slice(1) : l);
  // mémos des codes : seules les lignes qui commencent par « # » ou « \ » sont protégées
  const escapeMemo = (l) => (/^[#\\]/.test(l) ? '\\' + l : l);

  const DOC_CODE_RE = /^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$/;
  const RESERVED = /^(arbre|con|prn|aux|nul|com[1-9]|lpt[1-9])$/i;
  function checkDocCode(p, code, doc = null) {
    if (!DOC_CODE_RE.test(code) || code.endsWith('.')) return 'Le code ne peut contenir que des lettres sans accent, des chiffres, « - », « _ » et « . » (64 caractères au plus).';
    if (RESERVED.test(code)) return `« ${code} » est un nom réservé.`;
    if (p.docs.some((d) => d !== doc && (d.code || '').toLowerCase() === code.toLowerCase())) return `Le code « ${code} » est déjà utilisé.`;
    return '';
  }
  function nextDocCode(p, prefix = 'D') {
    const used = new Set(p.docs.map((d) => (d.code || '').toLowerCase()));
    let n = 1, c;
    do c = `${prefix}${String(n++).padStart(2, '0')}`; while (used.has(c.toLowerCase()));
    return c;
  }
  const PARA_ID_RE = /^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$/;
  const paraIdSet = (p, except = null) => {
    const s = new Set();
    for (const d of p.docs) if (d !== except) for (const pa of d.paras) s.add(String(pa.label).toLowerCase());
    return s;
  };
  /** Identifiant libre « <code>-NNN » à la suite des numéros déjà pris dans le document. */
  function nextParaId(doc, used) {
    let max = 0;
    const re = new RegExp('^' + doc.code.replace(/[.]/g, '\\.') + '-(\\d+)', 'i');
    for (const pa of doc.paras) { const m = String(pa.label).match(re); if (m) max = Math.max(max, +m[1]); }
    let id;
    do id = `${doc.code}-${String(++max).padStart(3, '0')}`; while (used.has(id.toLowerCase()));
    return id;
  }
  /** Donne un code au document et des identifiants valides et uniques (dans le projet) à ses paragraphes.
      Un identifiant importé valide et unique (ID_1373) est gardé ; « §4 » devient « <code>-004 ». */
  function assignIds(p, doc) {
    if (!doc.code || checkDocCode(p, doc.code, doc)) doc.code = nextDocCode(p);
    const used = paraIdSet(p, doc);
    const map = {};
    const todo = [];
    doc.paras.forEach((pa, i) => {
      const old = String(pa.label || '');
      const sec = old.match(/^§\s*(\d+)$/);
      let id = sec ? `${doc.code}-${sec[1].padStart(3, '0')}` : old;
      if (!sec && PARA_ID_RE.test(id) && used.has(id.toLowerCase())) id = `${doc.code}-${old}`;
      if (!PARA_ID_RE.test(id) || used.has(id.toLowerCase())) { todo.push(pa); map[old] = null; return; }
      used.add(id.toLowerCase());
      if (old && old !== id) map[old] = id;
      pa.label = id;
    });
    for (const pa of todo) { const old = pa.label; pa.label = nextParaId(doc, used); used.add(pa.label.toLowerCase()); if (old) map[old] = pa.label; }
    return map;
  }
  /** Change le code d'un document : préfixe des paragraphes et décisions de consensus suivent. */
  function renameDocCode(p, doc, code) {
    code = String(code || '').trim();
    const err = checkDocCode(p, code, doc);
    if (err) throw new Error(err);
    const old = doc.code;
    const pre = old.toLowerCase() + '-';
    const ids = {};
    for (const pa of doc.paras) if (String(pa.label).toLowerCase().startsWith(pre)) { const n = code + pa.label.slice(old.length); ids[pa.label] = n; pa.label = n; }
    for (const r of p.rejects) if (r.doc === old) { r.doc = code; if (ids[r.para]) r.para = ids[r.para]; }
    doc.code = code;
    return old;
  }

  // YAML minimal : une ligne « clé: valeur »
  const yamlValue = (v) => {
    v = String(v ?? '');
    return /: |^#|^["']|"/.test(v) || /^\s|\s$/.test(v) ? `"${v.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"` : v;
  };
  const yamlRead = (v) => {
    v = v.trim();
    const m = v.match(/^"(.*)"$/);
    if (m) return m[1].replace(/\\(["\\])/g, '$1');
    const s = v.match(/^'(.*)'$/);
    return s ? s[1].replace(/''/g, "'") : v;
  };
  function readYaml(lines) {
    const meta = {};
    let i = 0;
    if (lines[0] !== undefined && lines[0].trim() === '---') {
      for (i = 1; i < lines.length && lines[i].trim() !== '---'; i++) {
        const m = lines[i].match(/^([\p{L}\p{N}_.\-]+)\s*:\s?(.*)$/u);
        if (m) meta[m[1]] = yamlRead(m[2]);
      }
      i++;
    }
    return { meta, next: i };
  }
  const FIELD_RE = /^([\p{L}\p{N}_][\p{L}\p{N}_ .'’\-]*?)::\s?(.*)$/u;

  function codingLine(c) {
    const codes = c.codes.map((x) => '#' + x).join(' ');
    const tail = c.quote === null ? (c.whole || '(paragraphe entier)') : `« ${c.quote} »` + (c.occ > 1 ? ` [${c.occ}]` : '');
    return `> - ${codes} @${c.coder} : ${tail}`;
  }
  function parseCodingLine(line) {
    const m = line.match(/^>\s*[-*]\s+(.*)$/);
    if (!m) return null;
    let rest = m[1].trim();
    const codes = [];
    let t;
    while ((t = rest.match(/^#([^\s#@]+)\s*/))) { codes.push(t[1]); rest = rest.slice(t[0].length); }
    const cm = rest.match(/^@(\S+?)\s*:\s*(.*)$/);
    if (!codes.length || !cm) return null;
    const coder = cm[1];
    let q = cm[2].trim();
    if (/^\(paragraphe entier\)$/i.test(q)) return { codes, coder, quote: null, occ: 1 };
    if (/^\(réponse entière\)$/i.test(q)) return { codes, coder, quote: null, occ: 1, whole: q };
    let occ = 1;
    const om = q.match(/\s*\[([1-9]\d*)\]$/);
    if (om) { occ = parseInt(om[1], 10) || 1; q = q.slice(0, om.index).trim(); }
    let quote;
    const a = q.indexOf('«'), b = q.lastIndexOf('»');
    if (a === 0 && b === q.length - 1 && b > a) quote = q.slice(1, -1).replace(/^[\s\u00a0\u202f]/, '').replace(/[\s\u00a0\u202f]$/, '');
    else if (/^".*"$/.test(q)) quote = q.slice(1, -1);
    else return null;
    if (!quote) return null;
    return { codes, coder, quote, occ };
  }
  function splitHeading(h) {
    const k = h.lastIndexOf(' · ');
    return k > 0 ? { label: h.slice(0, k).trim(), speaker: h.slice(k + 3).trim() || null } : { label: h.trim(), speaker: null };
  }
  function addSpeaker(doc, name, role = null, attrs = null) {
    let s = doc.speakers.find((x) => x.name === name);
    if (!s) { s = { name, role: role || guessRole(name), attrs: {} }; doc.speakers.push(s); }
    else if (role) s.role = role;
    if (!s.attrs) s.attrs = {};
    for (const [k, v] of Object.entries(cleanAttrs(attrs))) if (!s.attrs[k]) s.attrs[k] = v;
    return s;
  }
  const PROJECT_SECTIONS = ['tree', 'memos', 'consensus', 'journal'];
  const SECTION_TITLES = { tree: '# Arbre de codes', memos: '# Mémos des codes', consensus: '# Décisions de consensus', journal: "# Journal de l'arbre de codes" };
  const sectionKind = (title) => {
    const t = fold(title);
    return /^memos? des codes|^memos?$/.test(t) ? 'memos' : /^journal/.test(t) ? 'journal' : /^decisions? de consensus|^consensus/.test(t) ? 'consensus'
      : /^arbre|^codes$/.test(t) ? 'tree' : /^documents?$/.test(t) ? 'docs' : null;
  };

  /** Lit un projet : format qda.md (`qda-format: 1`), ancien format adoq (`qda-md-etude`) ou
      arbre de QDA-md 0.9.1 (opts.legacyTree : lignes « > » sous un code = mémo). */
  function parseProject(src, opts = {}) {
    let text = String(src);
    const bom = text.startsWith('\uFEFF');
    if (bom) text = text.slice(1);
    const crlf = /\r\n/.test(text);
    text = text.replace(/\r\n?/g, '\n');
    const lines = text.split('\n');
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    const p = newProject('');
    const { meta, next } = readYaml(lines);
    const fmt = meta['qda-format'];
    const legacy = fmt === undefined;
    delete meta['qda-format']; delete meta['qda-md-etude']; if (opts.legacyTree) delete meta.type;
    p.meta = meta;
    if (legacy) { // ordre canonique : id, titre, puis le reste
      const { id, titre, ...rest } = meta;
      p.meta = { id: id || uid(), titre: titre || 'Projet sans titre', ...rest };
    }
    if (!p.meta.id) p.meta.id = uid();
    p.bom = bom; p.crlf = crlf; p.titles = {};
    p.order = []; p.preamble = [];
    let i = next;

    let section = opts.legacyTree ? 'tree' : null, raw = null;
    const stack = [];
    let lastCode = null, doc = null, para = null, memoCode = null;
    let part = null; // 'docfields' | 'doc' | 'parafields' | 'para'

/** Télécharge un texte (UTF-8) ou des octets (archive .zip). */
function download(data, name, mime = 'text/markdown') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: typeof data === 'string' ? mime + ';charset=utf-8' : mime }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

const safeName = (s) => String(s || 'projet').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 80) || 'projet';

  return t;
}
const looksProject = (text) => /^#\s+(arbre|documents)/im.test(text) || /^\uFEFF?---\r?\n(?:[^\n]*\n)*?qda-format\s*:/.test(text);
/** Choisit un ou plusieurs fichiers .md (sélecteur du système si possible). Renvoie [{name, text}]. */

  }

}
const codeLabel = (id) => (Q.findCode(S.p, id) || { label: id }).label;

// ---------- modifications, annulation, journal ----------
function countCoders() { S.nCoders = S.p ? Q.coders(S.p).length : 0; }
function changed() {
  countCoders();

  S.version++;
  S.saveError = false;

  schedulePersist();
}
/** Applique fn au projet avec possibilité d'annuler. where = {di, pi} pour ne redessiner qu'un paragraphe. */
function mutate(fn, where = null) {
  const snap = Q.snapshot(S.p);
  let r;
  try { r = fn(); } catch (e) { console.error(e); toast(e.message, true); return false; }
  if (r === false) return false;
  S.undo.push(snap);
  if (S.undo.length > 60) S.undo.shift();
  S.redo = [];
  changed();
  if (where) { renderPara(where.di, where.pi); renderTree(); renderDocs(); renderStats(); } else renderAll();
  return r;
}
const log = (type, desc, motif = '') => Q.logTree(S.p, type, desc, { coder: S.coder, motif: (motif || '').trim() });
const ref = (id) => Q.codeRef(S.p, id);
function undo() {
  if (!S.undo.length) return toast('Rien à annuler');
  S.redo.push(Q.snapshot(S.p));
  S.p = S.undo.pop();
  afterHistory();
  toast('Annulé');
}
function redo() {
  if (!S.redo.length) return toast('Rien à rétablir');

function afterHistory() {

// ---------- enregistrement ----------
let autosaveTimer, persistTimer;
function scheduleAutosave() {
  if (!S.handle) return;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => writeFile(), 1200);
}
async function writeFile() {
  if (!S.handle || S.saving) { if (S.saving) scheduleAutosave(); return false; }
  S.saving = true; updateStatus();
  const v = S.version;
  const text = Q.serializeProject(S.p);
  try {
    if (S.handle.queryPermission && (await S.handle.queryPermission({ mode: 'readwrite' })) !== 'granted') {
      if ((await S.handle.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('Permission refusée');
    }
    const w = await S.handle.createWritable();
    await w.write(text);
    await w.close();
    if (S.version === v) S.dirty = false;
    S.savedAt = Date.now();
    S.saveError = false;
    backup(text);
    schedulePersist();
  } catch (e) {
    console.warn(e);
    S.saveError = true;
  }
  S.saving = false;
  updateStatus();
  return !S.saveError;
}
async function save() {
  if (!S.p) return;
  if (S.handle) {
    if (await writeFile()) toast('Projet enregistré');
    else toast("Enregistrement impossible dans le fichier. Utilisez « Exporter › Enregistrer une copie ».", true);
    return;
  }
  return saveAs();
}
async function saveAs() {
  if (!S.p) return;
  const name = S.fileName || safeName(S.p.meta.titre) + '.qda.md';
  if (hasFS) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Projet adoq QDA', accept: { 'text/markdown': ['.md'] } }] });
      S.handle = h;
      S.fileName = h.name;
      await writeFile();
      addRecent();
      toast('Enregistré : ' + h.name + ' — les modifications suivantes seront enregistrées automatiquement');
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
      console.warn(e);
    }
  }
  const text = Q.serializeProject(S.p);
  download(text, name);
  S.fileName = name;
  S.dirty = false;
  S.savedAt = Date.now();
  backup(text, true);
  schedulePersist();
  updateStatus();
  toast(`Fichier téléchargé : ${name}. Pour reprendre votre travail, rouvrez ce fichier.`);
  return true;
}
function updateStatus() {
  const st = $('#status');

  let txt, cls = '';
  if (S.saveError) { txt = '⚠ Non enregistré'; cls = 'dirty'; }
  else if (S.handle) {
    if (S.saving || S.dirty) txt = 'Enregistrement…';
    else { txt = `✓ Enregistré${S.savedAt ? ' à ' + fmtTime(S.savedAt) : ''}`; cls = 'ok'; }
  } else if (S.dirty) { txt = '● Non enregistré'; cls = 'dirty'; }
  else { txt = S.savedAt ? `✓ Téléchargé à ${fmtTime(S.savedAt)}` : ''; cls = 'ok'; }
  st.textContent = txt;
  st.className = 'status ' + cls;
  st.title = S.handle ? `Fichier : ${S.handle.name} (enregistrement automatique)` : (hasFS ? 'Cliquez sur Enregistrer pour choisir où ranger le fichier' : 'Votre navigateur ne permet pas l’enregistrement automatique : cliquez sur Enregistrer');
  document.title = (S.dirty && !S.handle ? '● ' : '') + (S.p.meta.titre || 'Projet') + ' — adoq QDA';
}
function schedulePersist() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(persistWork, 1500);
}
async function persistWork() {
  if (!S.p || isPrivate()) return;
  const text = Q.serializeProject(S.p);
  await DB.set('work', { pid: S.p.meta.id, title: S.p.meta.titre, fileName: S.fileName, text, dirty: S.dirty && !S.handle, date: Date.now() });
  if (Date.now() - S.lastBackup > 5 * 60e3 && S.dirty) backup(text);
}
async function backup(text, force = false) {
  if (!S.p || isPrivate()) return;
  if (!force && Date.now() - S.lastBackup < 3 * 60e3) return;
  S.lastBackup = Date.now();
  await DB.addBackup({ pid: S.p.meta.id, title: S.p.meta.titre, date: Date.now(), size: text.length, text });
  const all = (await DB.backups(S.p.meta.id)) || [];
  all.sort((a, b) => b.date - a.date);
  for (const old of all.slice(20)) await DB.delBackup(old.n);
}
async function addRecent() {

      <p class="muted">Après la conversion, n’ouvrez plus ce projet avec adoq QDA 0.3 ou une version antérieure : elles ne comprennent pas le nouveau format.</p>`,
      buttons: [{ label: 'Convertir', value: 'ok', primary: true }, { label: 'Télécharger une copie, puis convertir', value: 'dl' }, { label: 'Annuler', value: '' }] });

function markup(text, spans) {
  if (!spans.length) return esc(text);
  const pts = new Set([0, text.length]);
  for (const s of spans) { pts.add(s.start); pts.add(s.end); }
  const arr = [...pts].sort((a, b) => a - b);
  let out = '';
  for (let k = 0; k < arr.length - 1; k++) {
    const a = arr[k], b = arr[k + 1];
    if (a === b) continue;
    const seg = esc(text.slice(a, b));
    const cov = spans.filter((s) => s.start <= a && s.end >= b);
    if (!cov.length) { out += seg; continue; }
    if (cov.some((s) => s.pending) && cov.length === 1) { out += `<span class="sq">${seg}</span>`; continue; }
    const ids = [...new Set(cov.flatMap((s) => s.coding.codes))];
    const cols = ids.map(color);
    const n = Math.min(cols.length, 4);
    const bg = cols.slice(0, n).map((c) => `linear-gradient(${c},${c})`).join(',');
    const pos = cols.slice(0, n).map((_, i) => `0 calc(100% - ${i * 3}px)`).join(',');
    const labels = ids.map(codeLabel).join(' · ');
    const style = `background-color:${rgba(cols[cols.length - 1] || '#f7e08a', Math.min(0.14 + 0.06 * cov.length, 0.34))};background-image:${bg};background-size:100% 3px;background-position:${pos};padding-bottom:${n * 3}px`;
    out += `<mark data-ci="${cov.filter((s) => !s.pending).map((s) => s.i).join(' ')}" title="${esc(labels)}" style="${style}"${cov.some((s) => s.pending) ? ' class="sq"' : ''}>${seg}</mark>`;
  }
  return out;
}

function textOffset(container, node, off) {
  const r = document.createRange();
  r.setStart(container, 0);
  r.setEnd(node, off);
  return r.toString().length;
}
function checkSelection() {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  const el = (n) => (n.nodeType === 1 ? n : n.parentElement);
  const a = el(r.startContainer)?.closest('.ptext'), b = el(r.endContainer)?.closest('.ptext');
  if (!a && !b) return;
  if (a !== b) return toast('Sélectionnez un passage à l’intérieur d’un seul paragraphe.');
  const box = a.closest('.para');
  const di = +box.dataset.di, pi = +box.dataset.pi;
  const pa = S.p.docs[di].paras[pi];
  let s = textOffset(a, r.startContainer, r.startOffset), e = textOffset(a, r.endContainer, r.endOffset);
  while (s < e && /\s/.test(pa.text[s])) s++;
  while (e > s && /\s/.test(pa.text[e - 1])) e--;
  if (e <= s) return;
  const quote = pa.text.slice(s, e);
  openPop({ di, pi, start: s, end: e, quote, occ: Q.occurrenceAt(pa.text, quote, s) }, r.getBoundingClientRect());
}
function openPop(target, rect) {

  let y = rect.bottom + 8;
  if (y + h > window.innerHeight - 8) y = rect.top - h - 8 >= 8 ? rect.top - h - 8 : Math.max(8, window.innerHeight - h - 8);

}
function closePop() {

}
function fillPop() {
  const q = $('#popq').value.trim();
  const fq = fold(q);

  const list = [...Q.walk(S.p.tree)];
  if (!q && S.active && Q.findCode(S.p, S.active)) items.push({ type: 'code', id: S.active, depth: 0, hint: 'code actif' });
  for (const { node, depth } of list) {
    if (fq && !fold(node.label).includes(fq)) continue;
    if (!q && node.id === S.active) continue;
    items.push({ type: 'code', id: node.id, depth: fq ? 0 : depth, hint: fq ? Q.codePath(S.p, node.id) : '' });
  }
  if (q && !locked() && !list.some(({ node }) => fold(node.label) === fq)) items.push({ type: 'create', label: q });

async function lockDialog() {

  }

async function hashCode(code, algo = null) {
  if ((algo === null || algo === 'sha256') && window.crypto && crypto.subtle) {
    try {
      const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('qda-md-etude:' + code));
      return 'sha256:' + [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch { /* repli ci-dessous */ }
  }
  let h = 0x811c9dc5;
  for (const ch of 'qda-md-etude:' + code) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return 'fnv:' + h.toString(16);
}

      return `<div class="ex"><div class="exh"><b>${esc(e.doc.name)}</b> › ${esc(e.para.label)}${e.para.speaker ? ` · <b>${esc(e.para.speaker)}</b>` : ''} · @${esc(e.coding.coder)}${withChildren ? ' · ' + e.codes.map((c) => esc(codeLabel(c))).join(', ') : ''}<button type="button" class="small" data-go="${k}">Aller au texte</button></div><div class="ext">${txt}</div></div>`;
    }).join('');
    $('#dlgbody').innerHTML = `<p class="muted">${esc(Q.codePath(S.p, id))}</p>
      ${n.def ? `<div class="notice info" style="white-space:pre-wrap">${esc(n.def)}</div>` : '<div class="notice">Ce code n’a pas encore de définition.</div>'}
      ${n.memo ? `<details><summary><b>Mémo du code</b></summary><div class="notice" style="white-space:pre-wrap;background:#fffbe9">${esc(n.memo)}</div></details>` : ''}
      <p><label><input type="checkbox" id="exch" ${withChildren ? 'checked' : ''} ${n.children.length ? '' : 'disabled'}> inclure les sous-codes</label>
      &nbsp; Codeur : <select id="excd"><option value="">tous</option>${cs.map((c) => `<option ${c === coder ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      &nbsp; <b>${ex.length}</b> extrait(s) dans <b>${docs}</b> document(s) &nbsp; <button type="button" class="small" id="exmemo">🗒 ${n.memo ? 'Modifier le mémo' : 'Écrire un mémo'}</button></p>${body}${ex.length > 400 ? '<p class="muted">Seuls les 400 premiers extraits sont affichés ; l’export les contient tous.</p>' : ''}`;
    $('#exch').onchange = (ev) => { withChildren = ev.target.checked; draw(); };
    $('#excd').onchange = (ev) => { coder = ev.target.value; draw(); };
    $('#exmemo').onclick = () => { $('#dlg').close(); codeMemoDialog(id); };
    $$('[data-go]').forEach((b) => (b.onclick = () => { const e = ex[+b.dataset.go]; $('#dlg').close(); goTo(S.p.docs.indexOf(e.doc), e.doc.paras.indexOf(e.para)); }));
  };
  dialog({ title: `Extraits — ${n.label}`, html: '', wide: true, buttons: [{ label: 'Fermer', value: 'ok', primary: true }, { label: 'Exporter en .md', value: 'exp' }], onOpen: draw }).then((v) => {
    if (v === 'exp') download(Q.extractsMarkdown(S.p, id, { withChildren, coder: coder || null }), `extraits_${id}.md`);
  });
}

/** Lit un projet en dossier (fichiers d'un dossier choisi), un .zip ou un .qda.md → projet. */
async function readProjectFiles(files) {
  if (files.length === 1 && /\.zip$/i.test(files[0].name)) {
    const list = await Q.unzipAll(await files[0].arrayBuffer(), (n) => /\.md$/i.test(n));
    return { p: Q.joinProject(list), name: files[0].name };
  }
  if (files.length === 1 && /\.md$/i.test(files[0].name) && !/(^|\/)arbre\.md$/i.test(files[0].webkitRelativePath || files[0].name)) {
    const text = await readTextFile(files[0]);
    if (!looksProject(text)) throw new Error(`${files[0].name} n’est pas un projet.`);
    return { p: Q.parseProject(text), name: files[0].name };
  }
  const md = files.filter((f) => /\.md$/i.test(f.name));
  const list = await Promise.all(md.map(async (f) => ({ path: f.webkitRelativePath || f.name, text: await readTextFile(f) })));
  const root = (md[0] && md[0].webkitRelativePath || '').split('/')[0];
  return { p: Q.joinProject(list), name: root || 'dossier' };
}

      ${d.paras.length ? `<details><summary>Fiche de l’entretien (facultatif)</summary><div class="grid2">
        <div><label class="f">Date</label><input type="date" data-meta="date" data-i="${i}" value="${esc(d.meta.date || '')}"></div>
        <div><label class="f">Lieu</label><input type="text" data-nofocus data-meta="lieu" data-i="${i}" value="${esc(d.meta.lieu || '')}"></div>
        <div><label class="f">Pseudo de la personne interviewée</label><input type="text" data-nofocus data-meta="pseudo" data-i="${i}" value="${esc(d.meta.pseudo || '')}" placeholder="repris du pseudo ci-dessus si vide"></div>
        <div><label class="f">Intervieweur·euse</label><input type="text" data-nofocus data-meta="intervieweur" data-i="${i}" value="${esc(d.meta.intervieweur || '')}"></div></div></details>` : ''}`;
  const bindCard = (i) => {
    const box = $(`[data-setup="${i}"]`);
    if (box) bindSpeakerSetup(box, pending[i]._st, () => { box.innerHTML = speakerSetupHTML(pending[i]._st, 'imp' + i); });
  };
  const drawList = () => {
    $('#implist').innerHTML = pending.map((d, i) => `<div class="ex" data-pd="${i}">${card(d, i)}</div>`).join('');
    $$('[data-del]', $('#implist')).forEach((b) => (b.onclick = () => { pending.splice(+b.dataset.del, 1); drawList(); }));
    pending.forEach((_, i) => bindCard(i));
  };
  const addFiles = async (files) => {
    for (const f of files) {
      try {
        let text;
        if (/\.zip$/i.test(f.name)) { tab('q'); await loadProj([f]); continue; }
        if (/\.docx$/i.test(f.name)) text = await Q.docxToText(await f.arrayBuffer());
        else if (/\.doc$|\.pdf$|\.odt$/i.test(f.name)) { pending.push({ name: f.name, paras: [], error: 'format non pris en charge : enregistrez-le en .docx ou .txt' }); continue; }
        else text = await readTextFile(f);
        if (looksProject(text)) { pending.push({ name: f.name, paras: [], error: 'c’est un projet : utilisez l’onglet « Projet QDA-md » pour l’ajouter à celui-ci' }); continue; }
        pending.push(prep(Q.textToDoc(f.name, text), Q.isIramuteq(text)));
      } catch (e) { pending.push({ name: f.name, paras: [], error: e.message }); }
    }
    drawList();
  };
  const addPasted = () => {
    const t = $('#ptext').value;
    if (!t.trim()) return;
    pending.push(prep(Q.textToDoc($('#pname').value.trim() || `Entretien ${S.p.docs.length + pending.length + 1}`, t), Q.isIramuteq(t)));
    $('#ptext').value = ''; $('#pname').value = '';
    drawList();
  };
  const tab = (k) => { $$('[data-tab]').forEach((x) => x.classList.toggle('on', x.dataset.tab === k)); $$('[data-pane]').forEach((p) => (p.hidden = p.dataset.pane !== k)); $('#implist').hidden = k === 'q'; $('#imphelp').hidden = k === 'q'; };
  dialog({
    title: 'Importer', wide: true,
    html: `<div class="tabs"><button type="button" class="on" data-tab="f">Fichiers</button><button type="button" data-tab="c">Coller un texte</button><button type="button" data-tab="q">Projet QDA-md</button></div>
      <div data-pane="f"><p><button type="button" class="primary" id="impbtn">Choisir des fichiers…</button> <span class="muted">.txt ou .docx, plusieurs à la fois (ou glissez-les dans la fenêtre)</span></p></div>
      <div data-pane="c" hidden><label class="f">Nom de l’entretien</label><input type="text" data-nofocus id="pname" placeholder="Entretien 1 — Marie"><label class="f">Texte</label><textarea id="ptext" style="min-height:160px"></textarea><p><button type="button" id="padd">Ajouter à la liste</button></p></div>
      <div data-pane="q" hidden><p>Ajoutez à ce projet un <b>projet QDA-md</b> (version de recherche) ou un projet adoq exporté en dossier : le dossier qui contient <span class="kbd">arbre.md</span> et <span class="kbd">donnees/</span>, une archive <span class="kbd">.zip</span> de ce dossier, ou un autre fichier <span class="kbd">.qda.md</span>. Ses entretiens, ses codes, ses mémos et ses codages sont <b>ajoutés</b> ; rien n’est effacé dans votre projet.</p>
        <p><button type="button" class="primary" id="qdir">Choisir un dossier…</button> <button type="button" id="qzip">Choisir un .zip ou un .qda.md…</button></p><div id="qinfo"></div></div>
      <div id="implist"></div>
      <p class="muted" id="imphelp"><b>Préparer la retranscription</b> : un paragraphe par prise de parole, séparés par une ligne vide. Commencez les questions par le nom de l’intervieweur·euse (« Zoé : Comment vous informez-vous ? ») ; les paragraphes sans nom sont attribués à la personne interviewée, dont l’import demande le pseudo. En focus group, commencez chaque prise de parole par le pseudo du ou de la participant·e. Le format Iramuteq (<span class="kbd">**** *ID_…</span>) est reconnu. Le texte importé n’est plus modifié ensuite : relisez votre retranscription avant.</p>`,
    buttons: [{ label: 'Importer', value: 'ok', primary: true }, { label: 'Annuler', value: '' }],
    onOpen: () => {
      $$('[data-tab]').forEach((b) => (b.onclick = () => tab(b.dataset.tab)));
      if (startTab !== 'f') tab(startTab);
      $('#qdir').onclick = () => { const inp = $('#fileDir'); inp.value = ''; inp.onchange = () => inp.files.length && loadProj([...inp.files]); inp.click(); };
      $('#qzip').onclick = () => { const inp = $('#fileProj'); inp.value = ''; inp.onchange = () => inp.files.length && loadProj([...inp.files]); inp.click(); };
      $('#impbtn').onclick = () => { const inp = $('#fileImport'); inp.value = ''; inp.onchange = () => addFiles([...inp.files]); inp.click(); };
      $('#padd').onclick = addPasted;
      $('#implist').addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset.meta) pending[+t.dataset.i].meta[t.dataset.meta] = t.value.trim();
      });
      if (preFiles) addFiles(preFiles);

  }).then((v) => {
    if (v === 'ok' && $('#ptext') && $('#ptext').value.trim()) addPasted();
    const docs = pending.filter((d) => !d.error && d.paras.length);
    if (v === 'ok' && proj && proj.p) {
      const other = proj.p, wasEmpty = !S.p.docs.length && !Q.allCodes(S.p).length;
      backup(Q.serializeProject(S.p), true);
      const rep = mutate(() => {
        const r = Q.mergeInto(S.p, other, { addDocs: true, coder: S.coder });
        if (wasEmpty) for (const [k, val] of Object.entries(other.meta)) if (!['id', 'titre'].includes(k) && S.p.meta[k] === undefined) S.p.meta[k] = val;
        log('import', `projet « ${other.meta.titre || proj.name} » : ${r.docs.length} document(s), ${r.codings} codage(s)`);
        return r;
      });
      if (rep) { S.cur = Math.max(0, S.p.docs.length - rep.docs.length); renderAll(); toast(`Projet importé : ${rep.docs.length} document(s), ${rep.codes.length} code(s), ${rep.codings} codage(s)`); }
    }
    if (v !== 'ok' || !docs.length) return;
    const first = S.p.docs.length;
    let nsp = 0;
    mutate(() => {
      for (const d of docs) {
        const st = d._st;
        if (st && st.mode !== 'none') {
          nsp += Q.applySpeakers(d, st.cands, { mode: st.mode, respondent: st.resp });
          if (st.mode === 'respondent' && st.resp.name.trim() && !d.meta.pseudo) d.meta.pseudo = st.resp.name.trim();
        }
        for (const k of Object.keys(d.meta)) if (!d.meta[k]) delete d.meta[k];
        delete d._st;
        Q.addDoc(S.p, d);
      }
    });
    S.cur = first;
    renderAll();
    toast(`${docs.length} entretien(s) importé(s), ${docs.reduce((a, d) => a + d.paras.length, 0)} paragraphes${nsp ? `, ${nsp} attribués à un locuteur` : ''}`);
    if (!S.handle && S.dirty && !hasFS) setTimeout(() => toast('Pensez à cliquer sur « Enregistrer »'), 2800);
  });
}

// ---------- comparaison, accord, consensus ----------
function compareDialog(startTab = null) {
  let other = null, otherName = '';
  const kclass = (k) => (k >= 0.8 ? 'k-good' : k >= 0.6 ? 'k-mid' : 'k-bad');
  const opts = () => {
    const o = { addDocs: $('#adddocs') ? $('#adddocs').checked : true, renameCoder: {}, coder: S.coder };
    const ren = $('#rencoder') && Q.cleanCoder($('#rencoder').value);
    if (ren && S.coder) o.renameCoder[S.coder] = ren;
    return o;
  };
  const drawMerge = () => {
    const pane = $('[data-pane="m"]');
    let html = `<p>Vous avez codé les mêmes entretiens qu’un·e collègue, chacun·e dans sa copie du projet ? Ouvrez ici sa copie : ses codages seront <b>ajoutés</b> aux vôtres (rien n’est effacé), ainsi que ses mémos, sa fiche d’entretien et son journal de l’arbre. Ensuite, mesurez votre accord et construisez un codage de consensus.</p>
      <p><button type="button" class="primary" id="pickother">Choisir le fichier .qda.md du ou de la collègue…</button></p>`;
    if (other) {
      const o = opts();
      const rep = Q.mergeInto(Q.snapshot(S.p), other, o);
      const oc = Q.coders(other);
      const clash = S.coder && oc.includes(S.coder);
      html += `<div class="notice info"><b>${esc(otherName)}</b> — codeur(s) : ${oc.map((c) => '@' + esc(c)).join(', ') || 'aucun'}</div>
        ${clash ? `<div class="notice">Cette copie contient des codages signés <b>@${esc(S.coder)}</b>, votre identifiant. S’ils ont été faits par une autre personne, renommez-les : <input type="text" data-nofocus id="rencoder" size="12" placeholder="nouvel identifiant" value="${esc(o.renameCoder[S.coder] || '')}"></div>` : ''}
        <table class="t"><tr><td>Codages ajoutés</td><td class="num">${rep.codings}</td></tr><tr><td>Codages complétés par de nouveaux codes</td><td class="num">${rep.completed}</td></tr><tr><td>Déjà présents</td><td class="num">${rep.already}</td></tr><tr><td>Codes ajoutés à l’arbre</td><td class="num">${rep.codes.length}${rep.codes.length && locked() ? ' <span class="muted">(ajoutés malgré le verrou, pour ne rien perdre)</span>' : ''}</td></tr><tr><td>Mémos de codes reçus</td><td class="num">${rep.memos}</td></tr><tr><td>Entrées du journal de l’arbre reçues</td><td class="num">${rep.journal}</td></tr><tr><td>Documents ajoutés</td><td class="num">${rep.docs.length}</td></tr><tr><td>Codages non fusionnables (texte différent)</td><td class="num">${rep.orphans.length}</td></tr></table>
        <p><label><input type="checkbox" id="adddocs" ${o.addDocs ? 'checked' : ''}> ajouter aussi les entretiens absents de mon projet</label></p>
        <p><button type="button" class="primary" id="domerge" ${rep.codings + rep.completed + rep.codes.length + rep.docs.length + rep.memos + rep.journal ? '' : 'disabled'}>Fusionner dans mon projet</button></p>
        ${rep.orphans.length ? `<details><summary>Codages non fusionnables</summary><pre class="code">${esc(rep.orphans.join('\n'))}</pre></details>` : ''}`;
    }
    pane.innerHTML = html;
    $('#pickother').onclick = async () => {
      const [f] = await pickMd(false);
      if (!f) return;
      if (!looksProject(f.text)) return toast('Ce fichier n’est pas un projet adoq QDA', true);
      other = Q.parseProject(f.text); otherName = f.name; drawMerge();
    };
    if (other) {
      $('#adddocs').onchange = drawMerge;
      if ($('#rencoder')) $('#rencoder').onchange = drawMerge;
      $('#domerge').onclick = () => {
        const o = opts();
        backup(Q.serializeProject(S.p), true);
        const rep = mutate(() => Q.mergeInto(S.p, other, o));
        if (rep) toast(`Fusion faite : ${rep.codings} codage(s) ajouté(s)`);
        other = null;
        drawMerge();
        tab('k');
      };
    }
  };
  let ka = null, kb = null, withQ = false;
  const pickPair = () => {
    const cs = Q.coders(S.p);
    if (!cs.includes(ka)) ka = cs.includes(S.coder) ? S.coder : cs.find((c) => c !== Q.CONSENSUS) || cs[0];
    if (!cs.includes(kb) || kb === ka) kb = cs.find((c) => c !== ka && c !== Q.CONSENSUS) || cs.find((c) => c !== ka);
    return cs;
  };
  const sel = (id, v, cs) => `<select id="${id}">${cs.map((c) => `<option ${c === v ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
  const drawKappa = () => {
    const pane = $('[data-pane="k"]');
    const cs = pickPair();
    if (cs.length < 2) { pane.innerHTML = '<p>Il faut au moins deux codeurs dans le projet. Fusionnez d’abord la copie d’un·e collègue (onglet 1).</p>'; return; }
    const r = Q.agreement(S.p, ka, kb, { withQuestions: withQ });
    pane.innerHTML = `<p>Comparer ${sel('ka', ka, cs)} et ${sel('kb', kb, cs)} — ${r.units} paragraphes, dans les ${r.docs.length} document(s) codés par les deux${r.excluded ? ` (${r.excluded} questions de l’intervieweur exclues)` : ''}.
      ${r.excluded || withQ ? `<label><input type="checkbox" id="withq" ${withQ ? 'checked' : ''}> inclure les questions</label>` : ''}</p>
      ${r.rows.length ? `<table class="t"><tr><th>Code</th><th class="num">les deux</th><th class="num">@${esc(ka)} seul</th><th class="num">@${esc(kb)} seul</th><th class="num">accord</th><th class="num">kappa</th></tr>
      ${r.rows.map((x, i) => `<tr class="click" data-row="${i}"><td><i class="dot" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${color(x.id)}"></i> ${esc(codeLabel(x.id))}</td><td class="num">${x.both}</td><td class="num">${x.onlyA}</td><td class="num">${x.onlyB}</td><td class="num">${Math.round(x.po * 100)} %</td><td class="num ${kclass(x.kappa)}">${x.kappa.toFixed(2).replace('.', ',')}</td></tr>`).join('')}</table>` : '<p>Aucun code commun à comparer.</p>'}
      <div id="kdiff"></div>
      <p class="muted">Kappa de Cohen calculé par paragraphe : pour chaque paragraphe, le code est-il présent chez l’un, chez l’autre, chez les deux, chez aucun ? Le kappa corrige l’accord dû au hasard. Les questions de l’intervieweur sont exclues, car on ne les code généralement pas : les compter gonflerait l’accord. Repères usuels : au-dessus de 0,8, très bon accord ; de 0,6 à 0,8, accord substantiel ; en dessous, la définition du code est à discuter. Cliquez sur une ligne pour voir les désaccords.</p>`;
    $('#ka').onchange = (e) => { ka = e.target.value; drawKappa(); };
    $('#kb').onchange = (e) => { kb = e.target.value; drawKappa(); };
    if ($('#withq')) $('#withq').onchange = (e) => { withQ = e.target.checked; drawKappa(); };
    $$('[data-row]', pane).forEach((tr) => (tr.onclick = () => {
      const x = r.rows[+tr.dataset.row];
      $('#kdiff').innerHTML = `<h3 style="font-size:14px">Désaccords sur « ${esc(codeLabel(x.id))} » (${x.diff.length})</h3>` + x.diff.slice(0, 200).map((d, k) => `<div class="ex"><div class="exh"><b>${esc(d.doc.name)}</b> › ${esc(d.para.label)}${d.para.speaker ? ' · ' + esc(d.para.speaker) : ''} · codé par <b>@${esc(d.who)}</b> seulement<button type="button" class="small" data-kgo="${k}">Aller au texte</button></div><div class="ext">${esc(d.para.text.slice(0, 400))}${d.para.text.length > 400 ? '…' : ''}</div></div>`).join('');
      $$('[data-kgo]').forEach((b) => (b.onclick = () => { const d = x.diff[+b.dataset.kgo]; $('#dlg').close(); S.view = ''; ls.set('view', ''); goTo(S.p.docs.indexOf(d.doc), d.doc.paras.indexOf(d.para)); renderTree(); }));
    }));
  };
  let showDone = false;
  const segText = (para, segA, segB) => {
    const t = para.text;
    const marks = [];
    for (const [segs, cls] of [[segA, 'ua'], [segB, 'ub']]) for (const s of segs) {
      if (s.quote === null) continue;
      const st = Q.locate(t, s.quote, s.occ);
      if (st >= 0) marks.push({ a: st, b: st + s.quote.length, cls });
    }
    if (!marks.length) return esc(t.length > 600 ? t.slice(0, 600) + '…' : t);
    const pts = [...new Set([0, t.length, ...marks.flatMap((m) => [m.a, m.b])])].sort((x, y) => x - y);
    let out = '';
    for (let k = 0; k < pts.length - 1; k++) {
      const seg = esc(t.slice(pts[k], pts[k + 1]));
      const c = [...new Set(marks.filter((m) => m.a <= pts[k] && m.b >= pts[k + 1]).map((m) => m.cls))];
      out += c.length ? `<span class="${c.length > 1 ? 'uab' : c[0]}">${seg}</span>` : seg;
    }
    return out;
  };
  const drawCons = () => {
    const pane = $('[data-pane="c"]');
    const cs = pickPair().filter((c) => c !== Q.CONSENSUS);
    if (cs.length < 2) { pane.innerHTML = '<p>Il faut au moins deux codeurs (hors @consensus). Fusionnez d’abord la copie d’un·e collègue (onglet 1).</p>'; return; }
    if (ka === Q.CONSENSUS || !cs.includes(ka)) ka = cs[0];
    if (kb === Q.CONSENSUS || !cs.includes(kb) || kb === ka) kb = cs.find((c) => c !== ka);
    const items = Q.consensusItems(S.p, ka, kb);
    const done = items.filter((x) => x.decided).length;
    const agreeTodo = items.filter((x) => x.agree && !x.decided);
    const list = items.filter((x) => showDone || !x.decided).sort((x, y) => (x.agree === y.agree ? 0 : x.agree ? 1 : -1));
    const shown = list.slice(0, 40);
    pane.innerHTML = `<p>Le codage de consensus se construit à partir de deux codages : pour chaque paragraphe et chaque code, on décide ensemble de <b>garder</b> ou d’<b>écarter</b> le codage. Le résultat est signé <b>@consensus</b> ; les codages de départ restent intacts.</p>
      <p>Codeurs : ${sel('ca', ka, cs)} <span class="ua">souligné en orange</span> et ${sel('cb', kb, cs)} <span class="ub">souligné en bleu</span></p>
      <div class="progress"><i style="width:${items.length ? Math.round((100 * done) / items.length) : 0}%"></i></div>
      <p><b>${done}</b> point(s) tranché(s) sur <b>${items.length}</b> · ${items.filter((x) => !x.agree).length} désaccord(s), ${items.filter((x) => x.agree).length} accord(s)
        ${agreeTodo.length ? ` &nbsp;<button type="button" class="primary small" id="takeagree">Reprendre les ${agreeTodo.length} accord(s) d’un coup</button>` : ''}
        &nbsp;<label><input type="checkbox" id="showdone" ${showDone ? 'checked' : ''}> afficher aussi les points tranchés</label></p>
      ${shown.map((x, k) => {
        const who = x.agree ? `<span class="badge agree">accord</span>` : `proposé par <b>@${esc(x.segA.length ? ka : kb)}</b> seulement`;
        const st = x.kept ? '<span class="badge ok">gardé</span>' : x.rejected ? '<span class="badge no">écarté</span>' : '';
        return `<div class="ex cons"><div class="exh"><b>${esc(x.doc.name)}</b> › ${esc(x.para.label)}${x.para.speaker ? ' · ' + esc(x.para.speaker) : ''} · ${chipHTML(x.code)} ${who} ${st}
          <span style="margin-left:auto;display:flex;gap:4px">${x.agree ? `<button type="button" class="small" data-keep="${k}" data-from="a">Garder (@${esc(ka)})</button><button type="button" class="small" data-keep="${k}" data-from="b">Garder (@${esc(kb)})</button>` : `<button type="button" class="small" data-keep="${k}" data-from="">Garder</button>`}<button type="button" class="small" data-rej="${k}">Écarter</button><button type="button" class="small" data-cgo="${k}">Texte</button></span></div>
          <div class="ext">${segText(x.para, x.segA, x.segB)}${[...x.segA, ...x.segB].some((s) => s.quote === null) ? ' <span class="muted">(paragraphe entier)</span>' : ''}</div></div>`;
      }).join('') || '<p class="muted">Tout est tranché. Le codage @consensus peut maintenant être comparé aux autres (onglet 2) ou retouché en prenant l’identifiant « consensus ».</p>'}
      ${list.length > 40 ? `<p class="muted">${list.length - 40} autre(s) point(s) à suivre.</p>` : ''}`;
    $('#ca').onchange = (e) => { ka = e.target.value; drawCons(); };
    $('#cb').onchange = (e) => { kb = e.target.value; drawCons(); };
    $('#showdone').onchange = (e) => { showDone = e.target.checked; drawCons(); };
    const ta = $('#takeagree');
    if (ta) ta.onclick = () => { mutate(() => { for (const x of agreeTodo) Q.consensusKeep(S.p, x, 'a'); }); toast(`${agreeTodo.length} accord(s) repris dans @consensus`); drawCons(); };
    $$('[data-keep]', pane).forEach((b) => (b.onclick = () => { const x = shown[+b.dataset.keep]; mutate(() => Q.consensusKeep(S.p, x, b.dataset.from || 'a')); drawCons(); }));
    $$('[data-rej]', pane).forEach((b) => (b.onclick = () => { const x = shown[+b.dataset.rej]; mutate(() => Q.consensusReject(S.p, x)); drawCons(); }));
    $$('[data-cgo]', pane).forEach((b) => (b.onclick = () => { const x = shown[+b.dataset.cgo]; $('#dlg').close(); goTo(S.p.docs.indexOf(x.doc), x.doc.paras.indexOf(x.para)); }));
  };
  const tab = (k) => {
    $$('[data-tab]').forEach((x) => x.classList.toggle('on', x.dataset.tab === k));
    $$('[data-pane]').forEach((p) => (p.hidden = p.dataset.pane !== k));
    ({ m: drawMerge, k: drawKappa, c: drawCons })[k]();
  };
  dialog({
    title: 'Comparer les codeurs', wide: true,
    html: `<div class="tabs"><button type="button" data-tab="m">1. Fusionner la copie d’un·e collègue</button><button type="button" data-tab="k">2. Accord entre codeurs</button><button type="button" data-tab="c">3. Codage de consensus</button></div><div data-pane="m"></div><div data-pane="k" hidden></div><div data-pane="c" hidden></div>`,
    onOpen: () => {
      $$('[data-tab]').forEach((b) => (b.onclick = () => tab(b.dataset.tab)));
      tab(startTab || (Q.coders(S.p).filter((c) => c !== Q.CONSENSUS).length >= 2 ? 'k' : 'm'));
    },
  });
}

/** Retire les réglages de l'app (clés « qdaE. »), sauf le choix d'effacement lui-même. */
const clearLocalKeys = () => { for (const k of Object.keys(localStorage)) if (k.startsWith('qdaE.') && k !== 'qdaE.private') localStorage.removeItem(k); };
/** Efface tout ce que l'app a rangé dans ce navigateur (sauvegardes, reprise, projets récents, réglages), sauf le réglage « private ». */
async function wipeBrowserData() {
  try { const d = await DB.db; if (d) d.close(); } catch { /* base absente */ }
  DB.db = null;
  await new Promise((res) => {
    try { const r = indexedDB.deleteDatabase('qda-md-etude'); r.onsuccess = r.onerror = r.onblocked = () => res(); } catch { res(); }
    setTimeout(res, 1500);
  });
  try { clearLocalKeys(); } catch { /* stockage indisponible */ }
}
function setPrivate(on) {
  try { localStorage.setItem('qdaE.private', JSON.stringify(!!on)); } catch { /* stockage indisponible */ }
}
const privacyHTML = () => `<div class="notice ${isPrivate() ? '' : 'info'}"><b>Effacer les données de ce navigateur quand on ferme adoq QDA ?</b>
    <label style="display:block;margin-top:6px"><input type="radio" name="privmode" value="non" ${isPrivate() ? '' : 'checked'}> <b>Non</b> — sur votre ordinateur personnel : le navigateur garde des copies de secours et propose de reprendre un travail non enregistré.</label>
    <label style="display:block"><input type="radio" name="privmode" value="oui" ${isPrivate() ? 'checked' : ''}> <b>Oui</b> — sur un ordinateur partagé ou avec des données sensibles : aucune copie n’est gardée, et identifiant, réglages et projets récents sont effacés à la fermeture. Seul votre fichier projet compte : pensez à l’enregistrer.</label>
    <p style="margin:8px 0 0"><button type="button" class="small" id="wipenow">Effacer maintenant les données de ce navigateur</button></p></div>`;
function bindPrivacy(onDone = () => {}) {
  $$('[name=privmode]').forEach((r) => (r.onchange = async () => {
    if (r.value === 'oui' && r.checked) {
      setPrivate(true);
      await wipeBrowserData();
      toast('Plus aucune copie n’est gardée dans ce navigateur ; les données existantes ont été effacées');
    } else if (r.value === 'non' && r.checked) {
      setPrivate(false);
      if (S.coder) ls.set('coder', S.coder);
      toast('Le navigateur gardera de nouveau des copies de secours');
      if (S.p) persistWork();
    }
    onDone();
  }));
  const w = $('#wipenow');
  if (w) w.onclick = async () => {
    if (!(await confirmDlg('Effacer les données de ce navigateur', '<p>Sauvegardes automatiques, travail non enregistré gardé pour la reprise, projets récents, identifiant et réglages seront effacés de ce navigateur.</p><p><b>Vos fichiers projet ne sont pas touchés.</b> Si le projet ouvert n’est pas enregistré, enregistrez-le d’abord.</p>', 'Effacer', true))) return;
    await wipeBrowserData();
    if (S.coder && !isPrivate()) ls.set('coder', S.coder);
    toast('Données du navigateur effacées');
    if (!S.p) renderHome();
  };
}
window.addEventListener('pagehide', () => {

});

function exampleProject() {

function codebookMarkdown() {
  const { seg, docs } = Q.counts(S.p);
  const L = [`# Livre de codes — ${S.p.meta.titre}`, '', `Exporté le ${fmtDate(Date.now())} · ${Q.allCodes(S.p).length} codes${locked() ? ' · arbre verrouillé' : ''}`, ''];
  for (const { node, depth } of Q.walk(S.p.tree)) {
    L.push(`${'#'.repeat(Math.min(depth + 2, 6))} ${node.label}`, '', `\`#${node.id}\` · ${seg[node.id] || 0} codage(s) dans ${docs[node.id] ? docs[node.id].size : 0} document(s)`, '');
    const o = Q.originOf(node);
    if (o) L.push(`*Origine : ${o === 'inductif' ? 'inductive' : 'déductive'}${node.fields.theorie ? ` (${node.fields.theorie})` : ''}*`, '');
    if (node.def) L.push(...node.def.split('\n').map((l) => '> ' + l), '');
    else L.push('_Pas de définition._', '');
    if (node.memo) L.push('**Mémo**', '', node.memo, '');
  }
  return L.join('\n');
}
